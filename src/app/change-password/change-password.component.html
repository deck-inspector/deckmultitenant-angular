<div class="pb-page" style="max-width:520px">
  <div class="card">
    <h3><mat-icon>lock</mat-icon> Change my password</h3>
    <p class="muted">For this E3 Admin login. Use at least 12 characters; a long phrase is best.</p>
    <div class="grid" style="grid-template-columns:1fr">
      <label>Current password <input type="password" autocomplete="current-password" [(ngModel)]="current"></label>
      <label>New password <input type="password" autocomplete="new-password" [(ngModel)]="next"></label>
      <label>New password again <input type="password" autocomplete="new-password" [(ngModel)]="confirm"></label>
    </div>
    <div class="note warn" *ngIf="problem">{{ problem }}</div>
    <div class="note warn" *ngIf="error">{{ error }}</div>
    <div class="note" *ngIf="done">Password changed. Use the new password next time you sign in.</div>
    <div class="actions">
      <button mat-flat-button color="primary" [disabled]="!ready || busy" (click)="save()">{{ busy ? 'Saving…' : 'Change password' }}</button>
    </div>
  </div>
</div>
